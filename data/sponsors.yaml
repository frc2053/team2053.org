# The sponsor grid. Edited in the CMS under "Sponsors".
#
# ORDER IS FILE ORDER. Sveltia's list widget is drag-to-reorder, and the
# template groups by tier while preserving the order within each tier. There is
# deliberately no order-number field: the old `sortOrder` was a global 1-15
# permutation that only ever tracked tier, and a student adding a sixteenth
# sponsor would type `16` and land last in Bronze whatever tier they picked.
#
# There is deliberately no `url` field either. It was empty on all fifteen
# sponsors and no template ever read it.
#
# The wrapping `sponsors:` key is not decoration - see data/socials.yaml for
# why a Sveltia file collection cannot address a file whose root is a list.
# The template reads hugo.Data.sponsors.sponsors.

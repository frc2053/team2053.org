# The whole site's configuration. Hugo is pinned in .github/workflows/publish.yml;
# this file deliberately does not restate the version.

baseURL: https://team2053.org/
locale: en-US
title: Southern Tier Robotics

# "Last updated" comes from the commit date, never from a field anyone types.
enableGitInfo: true
frontmatter:
  lastmod: [':git']

enableRobotsTXT: true

# The content model has no tags and no categories, so their pages should not exist.
disableKinds: [taxonomy, term]

# A section's own index page is titled from the directory name, and Hugo
# pluralizes it by default: content/blog/ would head its index "Blogs". The
# section directories here are already named the way their page should read.
pluralizeListTitles: false

# A post's publishDate is a field a student types, and Hugo hides content dated
# in the future. Left at its default, a post dated for next Friday would publish
# from the CMS, report success, and simply not be on the site - with nothing
# anywhere to say why, and nobody left here able to work it out. The date labels
# the post; it does not gate it.
buildFuture: true

# The five prose pages live under content/pages/ so the CMS can address them as
# a fixed file collection, but they serve at the top level: /about/, /contact/.
permalinks:
  page:
    pages: /:slug/

# The four structural entries, the ones that are not prose pages and so cannot
# arrive by cascade: Home is the site root, Blog and History are section
# indexes, and Merch Store is a shop on another host. Their weights interleave
# with the cascaded ones below - 10/20/50/60 against 30/40/70/80 - because Hugo
# merges config entries and page entries into ONE menu and sorts the whole thing
# together by weight. That is what reproduces the interleaved order from a plain
# `range site.Menus.main` with no template code.
#
# Reordering the nav is therefore a code edit. That is the accepted cost, taken
# deliberately: an order box is the one nav act a student can type a wrong
# answer into, and none of these four change from one season to the next.
menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 20
    - name: History
      pageRef: /history
      weight: 50
    # The only external entry, and so the only one carrying a literal URL.
    - name: Merch Store
      url: https://shop.team2053.org/
      weight: 60

# Menu membership is supplied here, never by a field in a content file, so no
# student can strand or dangle a page. Creating a page under content/pages/
# links it. Deleting one unlinks it. There is no "show in nav" checkbox to
# forget and no order number to get wrong - the whole nav has no student-facing
# control anywhere, in Sveltia or in front matter.
#
# The FIRST entry is the entire rule: every prose page is in the nav. The four
# after it only place the four that exist today, and carry no `menus` key
# because they do not need one - Hugo applies every cascade entry that matches
# and the most specific one wins per key, whatever order they are written in
# (verified on 0.165.0, both orderings).
#
# A page none of the four names gets no weight, and an unweighted entry sorts to
# the END of the menu, tiebroken alphabetically by name. So a sixth prose page
# appends itself to the nav, linked, with no field for anyone to fill in.
cascade:
  - target:
      path: /pages/**
    menus: main
  - target:
      path: /pages/about
    weight: 30
  - target:
      path: /pages/current-season
    weight: 40
  - target:
      path: /pages/sponsors
    weight: 70
  - target:
      path: /pages/contact
    weight: 80

params:
  contactEmail: southerntierrobotics@gmail.com
  affiliation: FIRST® Robotics Competition Team 2053 · Vestal, NY
  # The Sponsors page links to this rather than embedding it: <embed> renders a
  # blank rectangle on iOS Safari and most mobile browsers. The path is the one
  # the Astro site served it from, so links already in the wild still resolve.
  sponsorPacket: /assets/SponsorPacket.pdf

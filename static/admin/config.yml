# What the CMS shows a student, and where it puts what they write.
#
# Sveltia loads this from alongside index.html - /admin/config.yml - working it
# out from the page's own path. That is why nothing here is an absolute URL to
# this site: the same file is correct wherever the site is served from, whether
# that is a subdirectory or the domain root.

backend:
  name: github
  repo: frc2053/team2053.org
  branch: main
  # Token only. The alternative, OAuth, needs an OAuth client this project does
  # not run - Sveltia defaults to Netlify's - so leaving it enabled would put a
  # second sign-in button on the login screen that can never work, next to the
  # one that does. Students hold the token and never a login, which is also
  # what keeps the str-coder machine account inside GitHub's terms of service.
  auth_methods: [token]

# No review gate, as a decision rather than a limitation. Sveltia's editorial
# workflow exists and is declined: a gate with no reviewer turns "published
# immediately" into "never published", and it would need a token wider than
# Contents: write.
publish_mode: simple

# DELIBERATELY ABSENT: `skip_ci`. Setting it to EITHER value puts a "skip CI"
# toggle on the Publish button - the flag only controls which way it starts.
# A student who flips it publishes a commit carrying `[skip ci]`, which is an
# edit that lands in the repository and silently never reaches the site.
# Omitted, the toggle does not render at all and every publish builds.

app_title: Southern Tier Robotics

# One shared folder for every image, never per-page bundles. Deleting an entry
# that owns a bundle offers to delete the images inside it, and an image can be
# referenced from more than one page - so that offer is a way to break pages
# other than the one being deleted. A shared folder has no such offer.
media_folder: static/images
public_folder: /images

media_libraries:
  default:
    config:
      # Normalize the upload in the browser, before it ever enters git: a phone
      # photo becomes a 1920px WebP on the way in.
      transformations:
        raster_image:
          format: webp
          width: 1920
          quality: 85

      # 20 MiB, generous on purpose.
      #
      # VERIFIED against the bundle's own source, because the documentation
      # does not say which side of the transform this applies to, and it
      # inverts the setting. `services/assets/process.js` transforms the file
      # FIRST and then tests `file.size > maxFileSize`, so the cap is measured
      # against the transformed WebP, not the original upload.
      #
      # It is still not set to the site's 300 KB ceiling. A file over the cap
      # is not shrunk further or explained - it is listed as oversized and
      # cannot be uploaded at all, which strands the student with nothing to
      # do. The 300 KB ceiling is enforced after the commit instead, by
      # scripts/optimize-images.sh, which steps quality down until it fits.
      max_file_size: 20971520

      # scripts/optimize-images.sh states that "the CMS slugifies uploads" and
      # rewrites references with sed on the strength of it; check-site.sh
      # resolves the same names as URLs. Sveltia keeps the original filename by
      # DEFAULT, so without this line `Beach Day (2).JPG` would arrive with its
      # spaces, parentheses and capitals intact. This is the line that makes
      # the rest of the pipeline's assumption true.
      slugify_filename: true

# Feeds slugify_filename above, and the slug of any entry created from a title
# by a later collection. The default is `unicode`, which keeps accented and
# non-Latin characters in a filename verbatim.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: pages
    label: Pages
    label_singular: Page
    format: yaml-frontmatter
    # A FILE collection: a fixed list of entries. It has no `create` option and
    # no `delete` option - not set to false, absent from the shape - so these
    # pages are undeletable by construction rather than by a rule in a document
    # nobody reads.
    #
    # Three of the five prose pages are missing from this list because they do
    # not exist yet; slices 09 and 11 write them and add them here. An entry
    # pointing at a file that is not in the repository shows a student a blank
    # page and invites them to publish it, so scripts/check-cms-config.sh
    # reports it when this list and the content tree disagree. It reports,
    # rather than prevents: checks in this repository never gate the deploy, so
    # the drift ships and turns the workflow red and emails the team.
    files:
      - name: home
        label: Home
        file: content/_index.md
        # Anchored, and reused verbatim below, so the prose pages cannot drift
        # into several different shapes as they are added.
        fields: &page_fields
          - name: title
            label: Title
            widget: string
          - name: description
            label: Search description
            widget: string
            required: false
            hint: One sentence, shown by Google under the page's title.
          - name: heroImage
            label: Banner image
            widget: image
            required: false
            hint: The wide picture across the top. Leave empty for no banner.
          - name: heroImageAlt
            label: Banner image description
            widget: string
            required: false
            hint: What is in the picture, for people using a screen reader.
          - name: body
            label: Page
            widget: markdown
      - name: contact
        label: Contact
        file: content/pages/contact.md
        fields: *page_fields

  # Blog posts. A FOLDER collection, which is the whole difference from Pages
  # above: students create these and students delete them. Deletion has
  # Sveltia's own confirm dialog and nothing else behind it - there is no undo,
  # and recovery from a deletion is retyping the post out of the public commit
  # list. That is accepted rather than guarded, because every guard available
  # here (a review gate, an archive folder, a trash collection) needs somebody
  # to attend to it, and there is nobody.
  #
  # DELIBERATELY ABSENT: `tags` and `authors`.
  #
  # Tags had already rotted while the person who added them was still on the
  # team: 12 posts carrying 27 distinct tags, 16 of them used exactly once,
  # including curly-quote duplicates that publish two separate pages for the
  # same tag, and one empty string - so the old site published more tag pages
  # than it had posts. A controlled vocabulary nobody maintains is worse than
  # no vocabulary at all: it splits one topic across two pages that each list
  # one post. `authors` was set on none of the 12. hugo.yaml turns the taxonomy
  # off to match, so a tag typed here would not produce a page anyway.
  #
  # Reverse chronological is the only navigation a few-posts-a-season blog
  # needs, and scripts/check-cms-config.sh fails if either field reappears.
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: content/blog
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    sortable_fields: [publishDate, title]
    fields:
      - name: title
        label: Title
        widget: string
      - name: publishDate
        label: Date
        widget: datetime
        # Date only, no clock: the post is dated to the day everywhere it is
        # shown, and a time of day is one more thing to get wrong. `format` is
        # what gets written to the file; `date_format` is only what the picker
        # shows. Left without a default, the picker opens on today.
        format: 'YYYY-MM-DD'
        date_format: 'MMMM D, YYYY'
        time_format: false
        hint: The date on the post, and the order it appears in on the blog page. Newest first.
      - name: summary
        label: Summary
        widget: string
        required: false
        hint: One sentence. It is the card on the blog page and the line Google shows under the title.
      - name: featuredImage
        label: Banner image
        widget: image
        required: false
        hint: The wide picture across the top of the post and on its card. Leave empty for no picture.
      - name: body
        label: Post
        widget: markdown

  # A FOLDER collection, unlike Pages above. The team keeps having seasons, so
  # a new year is authored every season, indefinitely - and this is the only
  # content type that ages perfectly, since a 2025 entry is still correct in
  # 2031. Creating and deleting are both on, with Sveltia's own confirm as the
  # only guardrail; there is no undo, and recovery is retyping from the public
  # commit list.
  - name: history
    label: Robot Years
    label_singular: Robot Year
    folder: content/history
    format: yaml-frontmatter
    create: true
    # The file name, and therefore the address, is the year:
    # content/history/2025.md serves at /history/2025/. Left to the default
    # the slug would be built from the title and the address would read
    # /history/2025-game-reefscape/.
    slug: '{{fields.robotYear}}'
    summary: '{{fields.robotYear}} - {{fields.robotName}}'
    sortable_fields:
      fields: [robotYear, title]
      default:
        field: robotYear
        direction: descending
    # content/history/_index.md is the section's own page, and it sits in this
    # folder, so Sveltia lists it either way. Named here, it is presented as
    # the index file with its own three fields; left unnamed it would appear
    # as a robot year with no year, opening a robot-year form over a page that
    # has none of those fields.
    #
    # It carries the prose-page fields, reusing the anchor above rather than a
    # third near-copy of them: that page IS a prose page - title, description,
    # optional banner, body - and the site's shared layout gives it a banner
    # image on exactly the same terms as Home and Contact.
    index_file:
      label: History intro page
      fields: *page_fields
    fields:
      - name: title
        label: Title
        widget: string
        hint: 'Like: 2025 Game: Reefscape'
      - name: description
        label: Summary
        widget: string
        required: false
        hint: One or two sentences, shown at the top of the page and by Google.
      # Also the file name and the web address, via `slug` above. No
      # `value_type` line: the widget's default is already `int`, so the
      # number saves as 2025 rather than 2025.0 without being told to.
      - name: robotYear
        label: Season
        widget: number
        hint: The year, like 2025.
      - name: robotName
        label: Robot name
        widget: string
        required: false
      - name: wins
        label: Wins
        widget: number
        min: 0
      - name: losses
        label: Losses
        widget: number
        min: 0
      - name: events
        label: Events
        widget: list
        hint: One competition per line.
      # Optional, and the page prints no "Awards" heading at all when it is
      # empty. Nine of the twelve seasons have none, and the page this
      # replaces printed the heading over an empty list on every one of them.
      - name: awards
        label: Awards
        widget: list
        required: false
        hint: Leave empty if we did not win one. Nothing is shown either way.
      - name: featuredImage
        label: Robot photo
        widget: image
        required: false
      # A bare video ID, never a web address. The site builds the address, so
      # nobody here has to know which of YouTube's several link shapes works -
      # and the pattern refuses a pasted link rather than letting one through
      # to render an error inside the page. Required because every season has
      # a game reveal video, and because Sveltia applies a pattern to an empty
      # field too: an optional field with a pattern can never be left empty.
      #
      # The hint names the ADDRESS BAR and not the Share button, deliberately.
      # Share hands out `youtu.be/YWbxcjlY9JY?si=9hrawskXVOtzXbWR`, whose last
      # 11 characters are the tracking token - and a tracking token matches
      # this pattern perfectly well, so "the link ends with 11 characters"
      # would send a student straight past every guard to a dead embed. Two of
      # the twelve migrated years carry a `?si=` link, so this is a path
      # people here have actually walked.
      - name: gameVidUrl
        label: Game video code
        widget: string
        pattern:
          - '^[A-Za-z0-9_-]{11}$'
          - Just the 11 characters after "v=", like YWbxcjlY9JY - not the whole web address.
        hint: >-
          Play the video on YouTube and look at your browser's address bar:
          youtube.com/watch?v=YWbxcjlY9JY. Copy the 11 characters after "v=",
          stopping at "&" if there is one. Do not use the Share button - the
          link it copies ends with a tracking code, not the video's.
      - name: gameLogo
        label: Game logo
        widget: image
        required: false
      - name: body
        label: Page
        widget: markdown
  # ── The two data singletons ─────────────────────────────────────────────
  #
  # Both are FILE collections holding one YAML file each, and in both the whole
  # file is a single `list` widget. Sveltia's list widget is DRAG-TO-REORDER,
  # which is the entire reason these are one file rather than a folder of
  # entries: a folder collection has no manual order at all.
  #
  # The `- name:` immediately under `fields:` looks redundant against the file
  # name and is not. A file collection maps its fields onto the file's TOP-LEVEL
  # KEYS, so it cannot address a file whose root is a bare list; the list lives
  # one key down, and the templates read hugo.Data.sponsors.sponsors and
  # hugo.Data.socials.socials to match.

  - name: sponsors
    label: Sponsors
    files:
      - name: sponsors
        label: Sponsors
        file: data/sponsors.yaml
        fields:
          # THREE FIELDS, deliberately.
          #
          # No `url`: it was empty on all fifteen sponsors and no template ever
          # read it.
          #
          # No order number. The old `sortOrder` was a global 1-15 permutation
          # that only ever tracked tier, and rendering groups by tier first - so
          # a student adding a sixteenth sponsor would type `16` and land last
          # in Bronze whatever tier they chose. Dragging the row does what the
          # number was pretending to do, and cannot be typed wrong.
          - name: sponsors
            label: Sponsors
            label_singular: Sponsor
            widget: list
            summary: '{{fields.name}} - {{fields.tier}}'
            fields:
              - name: name
                label: Name
                widget: string
                hint: Printed under the logo. Several logos are hard to read on
                  their own, so this is what makes the grid legible.
              - name: logo
                label: Logo
                widget: image
              - name: tier
                label: Tier
                widget: select
                options: [Platinum, Gold, Silver, Bronze]
                hint: The page groups sponsors by tier, in this order. Drag a
                  row to change where it sits inside its tier.

  - name: socials
    label: Social links
    files:
      - name: socials
        label: Social links
        file: data/socials.yaml
        fields:
          - name: socials
            label: Social links
            label_singular: Social link
            widget: list
            summary: '{{fields.platform}}'
            fields:
              # A DROPDOWN, never a text box. These options are exactly the
              # eight icons committed under assets/social-icons/, lowercased,
              # so a student's choice can never produce a missing glyph.
              # scripts/check-cms-config.sh asserts the two lists still agree.
              #
              # Adding a ninth platform is honestly a code edit: its icon has to
              # exist as a file first. Pre-stocking unused icons was offered and
              # declined - carry only what the team uses.
              - name: platform
                label: Platform
                widget: select
                options: [X, TikTok, Instagram, YouTube, GitHub, Discord, Facebook, LinkedIn]
              - name: url
                label: Link
                widget: string
                hint: The full web address of the team's page there, starting
                  with https://

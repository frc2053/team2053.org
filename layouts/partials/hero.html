{{/* No hero image renders a plain title block, never an empty 460px band. */}}
{{ with .Params.heroImage }}
<div class="hero">
  <img src="{{ partial "url.html" . }}" alt="{{ $.Params.heroImageAlt | default "" }}">
  <div class="hero-scrim"></div>
  <div class="hero-cap">
    <h1>{{ $.Title }}</h1>
    {{ partial "updated.html" $ }}
  </div>
</div>
{{ else }}
<div class="noimg">
  <h1>{{ .Title }}</h1>
  {{ partial "updated.html" . }}
</div>
{{ end }}
